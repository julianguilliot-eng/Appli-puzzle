<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#CDEBFB;
    --bg-2:#4C93C7;
    --panel:#F4FAFF;
    --ink:#1C3A52;
    --wood-1:#2E6690;
    --wood-2:#153650;
    --mat-a:#EAF5FC;
    --mat-b:#D3E9F8;
    --teal:#2C8C7E;
    --teal-dark:#1F6B60;
    --coral:#F0562E;
    --coral-dark:#C7411E;
    --gold:#F4B93E;
  }
  *{box-sizing:border-box;}
  html, body{ overscroll-behavior-y: contain; }
  body{
    margin:0;
    min-height:100vh;
    font-family:'Nunito',sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.35), transparent 40%),
      linear-gradient(160deg,var(--bg-1) 0%,var(--bg-2) 100%);
    color:var(--ink);
  }

  .screen{ display:none; }
  .screen.active{ display:flex; }

  #screenSetup{
    flex-direction:column;
    align-items:center;
    width:100%;
    padding:28px 16px 60px;
  }

  #screenPuzzle.active{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    flex-direction:column;
    z-index:10;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.35), transparent 40%),
      linear-gradient(160deg,var(--bg-1) 0%,var(--bg-2) 100%);
  }

  .puzzle-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:14px 16px 10px;
    flex:0 0 auto;
  }
  .puzzle-topbar .topbar-title{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:clamp(20px,3.5vw,28px);
    color:var(--wood-2);
    text-shadow:1px 2px 0 rgba(255,255,255,0.5);
  }
  #backBtn{
    padding:10px 18px;
    font-size:14px;
    background:var(--panel);
    color:var(--wood-2);
    box-shadow:0 4px 0 rgba(21,54,80,0.3);
  }
  #backBtn:active{ box-shadow:0 1px 0 rgba(21,54,80,0.3); }
  @media (hover:hover){
    #backBtn:hover{ box-shadow:0 6px 0 rgba(21,54,80,0.3); }
  }
  #newFromPuzzleBtn{ padding:10px 18px; font-size:14px; }
  .topbar-right{ display:flex; align-items:center; gap:8px; }
  #fullscreenBtn{
    padding:10px 14px;
    font-size:16px;
    line-height:1;
  }
  #fullscreenBtn.hidden{ display:none; }

  #puzzleScroll{
    flex:1 1 auto;
    min-height:0;
    overflow:hidden;
    padding:0 16px 16px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  #screenPuzzle .play-area{
    align-items:center;
  }

  h1{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:clamp(32px,6vw,52px);
    margin:4px 0 0;
    color:var(--wood-2);
    text-shadow:2px 3px 0 rgba(255,255,255,0.5);
    letter-spacing:0.5px;
  }
  .subtitle{
    margin:4px 0 20px;
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    opacity:0.75;
    text-align:center;
    max-width:420px;
  }

  .panel{
    background:var(--panel);
    border-radius:26px;
    padding:18px 24px;
    box-shadow:0 3px 0 rgba(0,0,0,0.06) inset, 0 12px 0 rgba(21,54,80,0.25);
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    align-items:center;
    justify-content:center;
    max-width:960px;
    width:100%;
    margin-bottom:22px;
    border:3px solid rgba(21,54,80,0.12);
  }
  .control{ display:flex; flex-direction:column; align-items:center; gap:7px; min-width:150px; }
  .control label{
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:14px;
    color:var(--wood-2);
  }
  input[type="file"]{ display:none; }
  .file-btn{
    font-family:'Fredoka',sans-serif;
    display:inline-block;
    border:none;
    border-radius:16px;
    padding:11px 20px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    color:white;
    background:var(--teal);
    box-shadow:0 5px 0 var(--teal-dark);
    transition:transform .08s ease, box-shadow .08s ease;
    white-space:nowrap;
  }
  .file-btn:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--teal-dark); }
  @media (hover:hover){
    .file-btn:hover{ transform:translateY(-2px); box-shadow:0 7px 0 var(--teal-dark); }
  }
  .file-name{
    margin-top:4px;
    font-size:12px;
    font-weight:700;
    color:var(--wood-2);
    max-width:170px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    text-align:center;
  }
  .file-name.empty{
    opacity:0.5;
    font-weight:600;
  }
  input[type="range"]{
    width:150px;
    accent-color:var(--teal);
  }
  .piece-count{
    font-family:'Fredoka',sans-serif;
    font-size:13px;
    background:var(--teal);
    color:white;
    border-radius:14px;
    padding:3px 12px;
    font-weight:600;
    box-shadow:0 3px 0 var(--teal-dark);
  }

  button{
    font-family:'Fredoka',sans-serif;
    border:none;
    border-radius:16px;
    padding:13px 26px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    color:white;
    background:var(--coral);
    box-shadow:0 5px 0 var(--coral-dark);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  button:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--coral-dark); }
  button.secondary{ background:var(--teal); box-shadow:0 5px 0 var(--teal-dark); }
  button.secondary:active{ box-shadow:0 1px 0 var(--teal-dark); }
  @media (hover:hover){
    button:hover{ transform:translateY(-2px); box-shadow:0 7px 0 var(--coral-dark); }
    button.secondary:hover{ box-shadow:0 7px 0 var(--teal-dark); }
  }

  #winToast{
    display:none;
    align-items:center;
    gap:12px;
    background:var(--gold);
    color:var(--wood-2);
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:clamp(16px,3vw,20px);
    padding:12px 22px;
    border-radius:18px;
    box-shadow:0 6px 0 #C98F1F;
    margin-bottom:18px;
    animation:pop .35s ease;
  }
  @keyframes pop{
    from{ transform:scale(0.8) translateY(-8px); opacity:0; }
    to{ transform:scale(1) translateY(0); opacity:1; }
  }
  #winToast button{ padding:9px 18px; font-size:14px; }

  .play-area{
    display:flex;
    flex-wrap:wrap;
    gap:22px;
    justify-content:center;
    align-items:center;
    width:100%;
    max-width:1500px;
    margin:0 auto;
  }
  @media (min-width:701px), (orientation:landscape){
    .play-area{ flex-wrap:nowrap !important; }
  }

  #frameOuter{
    flex:0 0 auto;
    background:linear-gradient(155deg,var(--wood-1),var(--wood-2));
    border-radius:8px;
    padding:14px;
    box-shadow:0 14px 0 rgba(0,0,0,0.18), inset 0 0 0 2px rgba(255,255,255,0.08);
  }
  #frame{
    position:relative;
    background:repeating-conic-gradient(var(--mat-a) 0% 25%,var(--mat-b) 0% 50%) 50% / 26px 26px;
    border-radius:2px;
    box-shadow:inset 0 0 0 5px rgba(255,255,255,0.55), in
